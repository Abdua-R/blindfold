[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindfold"
version = "0.1.0"
description = "Local privacy layer for Claude Code"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pymorphy3>=2.0",
  "pypdf>=4",
  "pandas>=2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
ner = ["gliner2"]
dev = ["pytest>=8", "python-pptx>=1.0", "python-docx>=1.1", "fpdf2>=2.7"]

[project.scripts]
blindfold = "blindfold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindfold = ["data/*.txt", "skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
